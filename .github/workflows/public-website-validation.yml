name: Public website validation
on:
  push:
    branches:
      - feature/public-homepage-staging
  workflow_dispatch:
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --workspace @attendra/dashboard run build
      - run: npm --workspace @attendra/dashboard test
