services:
  - type: web
    name: attendra-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm --workspace @attendra/api run build
    preDeployCommand: npm --workspace @attendra/api run migrate
    startCommand: npm --workspace @attendra/api run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: attendra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: attendra-dashboard
    runtime: static
    buildCommand: npm install && npm --workspace @attendra/dashboard run build
    staticPublishPath: apps/dashboard/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_COMPANY_ID
        sync: false

  - type: web
    name: attendra-tablet
    runtime: static
    buildCommand: npm install && npm --workspace @attendra/tablet run build
    staticPublishPath: apps/tablet/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_COMPANY_ID
        sync: false
      - key: VITE_BRANCH_ID
        sync: false
      - key: VITE_DEVICE_ID
        sync: false
      - key: VITE_BRANCH_NAME
        sync: false

  - type: web
    name: attendra-employee-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm --workspace @attendra/employee-api run build
    startCommand: npm --workspace @attendra/employee-api run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: attendra-db
          property: connectionString
      - key: EMPLOYEE_TOKEN_SECRET
        generateValue: true

  - type: web
    name: attendra-employee
    runtime: static
    buildCommand: npm install && npm --workspace @attendra/employee run build
    staticPublishPath: apps/employee/dist
    envVars:
      - key: VITE_EMPLOYEE_API_URL
        sync: false

databases:
  - name: attendra-db
    databaseName: attendra
    user: attendra
