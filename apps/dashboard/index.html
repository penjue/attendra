<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Attendra</title></head><body><div id="root"></div><script src="/tenant-runtime.js"></script><script type="module" src="/src/main.tsx"></script><script src="/live-overview.js" defer></script><script src="/alerts-center.js" defer></script><script>(function(){function boot(){if(document.getElementById('pilot-inline-btn'))return;var b=document.createElement('button');b.id='pilot-inline-btn';b.textContent='+ Pilot company';b.style.cssText='position:fixed;right:16px;bottom:16px;z-index:2147483646;border:0;border-radius:999px;padding:12px 16px;background:#111827;color:#fff;font:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';b.onclick=function(){var m=document.createElement('div');m.style.cssText='position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px';m.innerHTML='<div style="background:#fff;color:#111827;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:22px"><h2 style="margin:0 0 6px">Onboard pilot company</h2><p style="color:#64748b">Create an isolated Attendra company, owner account and first branch.</p><form id="pilot-inline-form" style="display:grid;gap:12px"><input name="companyName" placeholder="Company name" required style="padding:12px"><select name="countryCode" style="padding:12px"><option value="GB">United Kingdom</option><option value="KE">Kenya</option></select><input name="timezone" value="Europe/London" required style="padding:12px"><select name="currency" style="padding:12px"><option value="GBP">GBP</option><option value="KES">KES</option></select><input name="ownerEmail" type="email" placeholder="Owner email" required style="padding:12px"><input name="ownerPassword" type="password" minlength="12" placeholder="Temporary password (12+ characters)" required style="padding:12px"><input name="branchName" placeholder="First branch name" style="padding:12px"><input name="branchAddress" placeholder="Branch address (optional)" style="padding:12px"><div id="pilot-inline-msg" style="padding:10px;background:#f1f5f9;border-radius:10px">Use a unique temporary password and share it only with the authorised company owner.</div><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" id="pilot-inline-cancel" style="padding:10px 14px">Cancel</button><button type="submit" style="padding:10px 14px;background:#111827;color:#fff;border:0;border-radius:8px">Create pilot company</button></div></form></div>';document.body.appendChild(m);var f=m.querySelector('#pilot-inline-form'),c=f.countryCode,t=f.timezone,cur=f.currency,msg=m.querySelector('#pilot-inline-msg');c.onchange=function(){var ke=c.value==='KE';t.value=ke?'Africa/Nairobi':'Europe/London';cur.value=ke?'KES':'GBP'};m.querySelector('#pilot-inline-cancel').onclick=function(){m.remove()};f.onsubmit=async function(e){e.preventDefault();msg.textContent='Creating pilot company...';var d=Object.fromEntries(new FormData(f).entries());try{var r=await fetch('https://attendra-api.onrender.com/v1/platform/pilot-companies',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(sessionStorage.getItem('attendra_admin_token')||'')},body:JSON.stringify({companyName:d.companyName,countryCode:d.countryCode,timezone:d.timezone,currency:d.currency,ownerEmail:d.ownerEmail,ownerPassword:d.ownerPassword,branchName:d.branchName||undefined,branchAddress:d.branchAddress||undefined})});var j=await r.json();if(!r.ok)throw new Error(j.error||'ONBOARDING_FAILED');msg.style.background='#ecfdf5';msg.style.color='#065f46';msg.innerHTML='Pilot company created successfully.<br><strong>'+j.company.name+'</strong><br>Owner: '+j.owner.email+'<br>Company ID: '+j.company.id}catch(err){msg.style.background='#fef2f2';msg.style.color='#991b1b';msg.textContent=err.message}}};document.body.appendChild(b)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();})();</script></body></html>
