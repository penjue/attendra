<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendra Tablet Activation</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:32px}main{max-width:960px;margin:0 auto}.brand{font-size:14px;font-weight:800;letter-spacing:.16em;color:#475569}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}h1{font-size:36px;margin:6px 0 0}.card{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-bottom:18px}.device{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid #e2e8f0}.device:first-child{border-top:0}.meta{display:flex;flex-direction:column;gap:5px}.meta strong{font-size:18px}.meta span,.meta small{color:#64748b}.btn{border:0;border-radius:12px;background:#0f172a;color:white;font-weight:700;padding:12px 16px;cursor:pointer}.btn.secondary{background:white;color:#0f172a;border:1px solid #cbd5e1}.notice{padding:14px 16px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;margin-top:14px}.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}.activation{margin-top:16px;padding:18px;border-radius:14px;background:#f8fafc;border:1px solid #cbd5e1}.activation code{display:block;word-break:break-all;background:white;padding:12px;border-radius:10px;border:1px solid #e2e8f0;margin:10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:700px){body{padding:16px}.hero,.device{align-items:flex-start;flex-direction:column}h1{font-size:30px}.btn{width:100%}}
  </style>
</head>
<body>
<main>
  <div class="hero"><div><div class="brand">ATTENDRA HQ</div><h1>Tablet activation</h1></div><button class="btn secondary" onclick="location.href='/'">Back to dashboard</button></div>
  <section class="card">
    <strong>How it works</strong>
    <p>Choose a registered tablet below and generate an activation link. Open that link on the physical tablet once. The tablet will remember its company and branch and then show the employee check-in/out screen.</p>
    <div id="status"></div>
  </section>
  <section class="card">
    <h2>Registered tablets</h2>
    <div id="devices">Loading…</div>
  </section>
</main>
<script>
(() => {
  const API_URL = 'https://attendra-api.onrender.com';
  const TABLET_URL = 'https://attendra-tablet.onrender.com';
  const token = sessionStorage.getItem('attendra_admin_token') || '';
  const status = document.getElementById('status');
  const devicesEl = document.getElementById('devices');

  function companyIdFromToken(value){
    if(!value) return '';
    const part=String(value).split('.')[0]||'';
    try{const raw=part.replace(/-/g,'+').replace(/_/g,'/');const padded=raw+'='.repeat((4-raw.length%4)%4);return JSON.parse(atob(padded)).companyId||''}catch{return ''}
  }
  const companyId=companyIdFromToken(token);
  const headers={'Content-Type':'application/json','Authorization':`Bearer ${token}`};

  function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function showStatus(text,error=false){status.innerHTML=`<div class="notice ${error?'error':''}">${escapeHtml(text)}</div>`}

  async function api(path,options={}){
    const response=await fetch(API_URL+path,{...options,headers:{...headers,...(options.headers||{})}});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||'Request failed');
    return data;
  }

  async function generate(device){
    try{
      showStatus(`Generating activation for ${device.name}…`);
      const data=await api(`/v1/admin/devices/${encodeURIComponent(device.id)}/reset-key`,{method:'POST',body:'{}'});
      const params=new URLSearchParams({companyId,branchId:device.branchId,deviceId:device.id,branchName:device.branchName||'Attendra Branch',deviceName:device.name,deviceKey:data.deviceKey});
      const url=`${TABLET_URL}/?${params.toString()}`;
      const row=document.getElementById(`activation-${device.id}`);
      row.innerHTML=`<div class="activation"><strong>Activation link ready</strong><p>Open this link on the physical tablet. It can be used to bind that browser to <b>${escapeHtml(device.branchName)}</b>.</p><code>${escapeHtml(url)}</code><div class="actions"><button class="btn" id="copy-${device.id}">Copy activation link</button><button class="btn secondary" id="open-${device.id}">Open on this device</button></div><small>Generating a new link invalidates the previous device key.</small></div>`;
      document.getElementById(`copy-${device.id}`).onclick=async()=>{await navigator.clipboard.writeText(url);showStatus('Activation link copied. Send or open it only on the intended tablet.')};
      document.getElementById(`open-${device.id}`).onclick=()=>window.open(url,'_blank','noopener');
      showStatus('Activation link generated successfully.');
    }catch(error){showStatus(error.message||'Unable to generate activation link.',true)}
  }

  async function load(){
    if(!token||!companyId){devicesEl.innerHTML='<div class="notice error">Sign in to Attendra HQ first, then open this page again.</div>';return}
    try{
      const data=await api('/v1/admin/devices');
      if(!data.devices.length){devicesEl.innerHTML='<p>No tablets are registered yet. Register a tablet from Devices in the main dashboard first.</p>';return}
      devicesEl.innerHTML='';
      data.devices.forEach(device=>{
        const wrap=document.createElement('div');
        wrap.innerHTML=`<div class="device"><div class="meta"><strong>${escapeHtml(device.name)}</strong><span>${escapeHtml(device.branchName)}</span><small>${device.active?'Active':'Inactive'} · ${device.online?'Online':'Offline'} · ${device.lastSeenAt?'Last seen '+new Date(device.lastSeenAt).toLocaleString():'Never seen'}</small></div><button class="btn" ${device.active?'':'disabled'}>Generate activation link</button></div><div id="activation-${device.id}"></div>`;
        const button=wrap.querySelector('button');
        button.onclick=()=>generate(device);
        devicesEl.appendChild(wrap);
      });
    }catch(error){devicesEl.innerHTML=`<div class="notice error">${escapeHtml(error.message||'Unable to load tablets.')}</div>`}
  }
  load();
})();
</script>
</body>
</html>
